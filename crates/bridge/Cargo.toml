[package]
name = "bridge"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
description  = "AttaCode TUI↔Core glue layer — bootstraps runtime::Agent, converts AgentEvent into tui::FrameState"

[dependencies]
tui         = { path = "../tui" }

# `sandbox` 打开 macOS `sandbox-exec` / Linux `bubblewrap` 那两个后端。AttaCore
# 0.2.1 起它是编译期 feature 且**默认关**，理由是"机主就坐在机器前时，沙箱只是
# 权限门后面的纵深防御"。我们仍然打开它，因为 0.1.8 之前它就是编译进来的，跟着
# 上游改默认值等于在一次 bump 里静默降级；而且关掉之后
# `sandbox.require_enforcement = true` 会**拒绝每一条命令**——一个设了它的用户
# 拿到的不是"没沙箱"，是"Bash 全废"。
base        = { workspace = true, features = ["sandbox"] }
model       = { workspace = true }
runtime     = { workspace = true }
scene       = { workspace = true }
permissions = { workspace = true }
tools       = { workspace = true }
compaction  = { workspace = true }
history     = { workspace = true }
session     = { workspace = true }

tokio       = { workspace = true }
tokio-util  = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# 只有 `commands` 的单测需要它——生产路径上技能目录完全由 Core 的
# `CommandRegistry` 持有，bridge 不再自己装配 `SkillManager`。
skills    = { workspace = true }
# `test-util` 给的是假时钟（`time::advance`）——状态行的 500ms tick 靠它测，
# 不然只能 sleep 真实时间，慢且 flaky。
tokio     = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
anyhow    = { workspace = true }
tempfile  = { workspace = true }
