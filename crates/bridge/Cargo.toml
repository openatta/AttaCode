[package]
name = "bridge"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
publish      = { workspace = true }
description  = "AttaCode TUI↔Core glue layer — bootstraps runtime::Agent, converts AgentEvent into tui::FrameState"

[dependencies]
tui         = { path = "../tui" }

base        = { workspace = true }
model       = { workspace = true }
runtime     = { workspace = true }
scene       = { workspace = true }
permissions = { workspace = true }
compaction  = { workspace = true }
history     = { workspace = true }
session     = { workspace = true }

tokio       = { workspace = true }
tokio-util  = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
url         = { workspace = true }

[dev-dependencies]
# 只有 `commands` 的单测需要它——生产路径上技能目录完全由 Core 的
# `CommandRegistry` 持有，bridge 不再自己装配 `SkillManager`。
skills    = { workspace = true }
tokio     = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
anyhow    = { workspace = true }
tempfile  = { workspace = true }
