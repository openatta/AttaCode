name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel previous runs on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # **必须**带上 submodule：整个 workspace 的依赖都是 `path = "core/crates/*"`，
      # core/ 是空目录的话 cargo 连清单都读不出来，`cargo test` 一步都走不到。
      # 这一行从初始提交起就漏了，等于 CI 从来没真正跑过。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # `git submodule update` 把 core/ 留在 detached HEAD 上——这是子模块的常态，
      # 但 AttaCore 有个测试（frozen::tests::detects_git_repo_in_a_real_repo）断言
      # `git symbolic-ref --short HEAD` 能出东西，detached 时它必挂。跟我们的代码
      # 无关，纯粹是那个测试假设了"HEAD 接在分支上"。
      # 已报给 AttaCore（见 scripts/core-issues.md），那边改完这一步就能删。
      - name: Attach the submodule HEAD to a branch (AttaCore test workaround)
        run: git -C core checkout -B ci-detached-head-workaround HEAD

      # rustup is preinstalled on GitHub-hosted runners; we just need to
      # ensure stable + components are present.
      - name: Configure Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # **v2-6 (M30)**: on Windows we explicitly want the named-pipe daemon
      # tests to run. They're cfg(windows)-gated so they're invisible elsewhere.
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

      # **D3 (M30)**: clippy ran ubuntu-only before; M30 cleanup got the
      # workspace down to zero warnings, so strict mode is feasible on every
      # platform. Catches windows-only path/cfg issues we'd otherwise miss
      # until next CI run.
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
