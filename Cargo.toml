[workspace]
resolver = "2"
members = ["crates/tui", "crates/keybindings", "crates/bridge", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
publish = false
authors = ["AttaCode contributors"]
repository = "https://github.com/openatta/AttaCode"

# ──────────────────────────────────────────────
# AttaCore internal crates (submodule at core/)
# ──────────────────────────────────────────────
[workspace.dependencies]
base        = { path = "core/crates/core" }
model       = { path = "core/crates/model" }
auth        = { path = "core/crates/auth" }
hooks       = { path = "core/crates/hooks" }
plugin      = { path = "core/crates/plugin" }
telemetry   = { path = "core/crates/telemetry" }
history     = { path = "core/crates/history" }
permissions = { path = "core/crates/permissions" }
mcp         = { path = "core/crates/mcp" }
tools       = { path = "core/crates/tools" }
skills      = { path = "core/crates/skills" }
runtime     = { path = "core/crates/runtime" }
compaction  = { path = "core/crates/compaction" }
session     = { path = "core/crates/session" }
scene       = { path = "core/crates/scene" }
team        = { path = "core/crates/team" }
task        = { path = "core/crates/task" }

# ──────────────────────────────────────────────
# Third-party dependencies (shared with AttaCore)
# ──────────────────────────────────────────────
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
eventsource-stream = "0.2"
bytes = "1"
url = "2"

# WebSocket
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Serialize
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
unicode-normalization = "0.1"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Common
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
regex = "1"
glob = "0.3"
globset = "0.4"
html2text = "0.6"
which = "7"
similar = "2"
base64 = "0.22"
ignore = "0.4"
walkdir = "2"
tiktoken-rs = "0.6"
toml = "0.8"
bs58 = "0.5"
async-stream = "0.3"

# MCP
rmcp = { version = "1.6", features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
pulldown-cmark = "0.13"
syntect = "5"

# CLI
clap = { version = "4", features = ["derive"] }
rustyline = "14"

# Dev
tempfile = "3"
notify = "6"
